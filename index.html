<style>
body{margin:0;background:#F9F2EC}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{scroll-behavior:smooth}
.howscore summary::marker{color:#A5DFD3}.howscore summary:focus-visible,.detail-toggle:focus-visible{outline:2px solid #A5DFD3;outline-offset:3px}.detail-toggle:hover{background:#F9F2EC!important}

.card-toggle:focus-visible{outline:2px solid #006F62;outline-offset:4px}
.card-toggle:hover h3{text-decoration:underline;text-underline-offset:3px}
.gslide{opacity:0;transition:opacity .9s ease}.gslide.is-on{opacity:1}
.gnav{position:absolute;top:calc((100% - 56px) / 2);transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:#003E32;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .2s}
.gprev{left:10px}.gnext{right:10px}
.gallery:hover .gnav,.gallery:focus-within .gnav{opacity:1}
.gnav:focus-visible,.gdot:focus-visible{outline:2px solid #A5DFD3;outline-offset:2px}
.gdot{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,30,24,.25);cursor:pointer}
.gdot[aria-current="true"]{background:#FFFFFF}
@media (hover: none){.gnav{opacity:1}}
@media (prefers-reduced-motion: reduce){.gslide{transition:none}}

.secnav{scrollbar-width:none}.secnav::-webkit-scrollbar{display:none}
.navlink{display:inline-flex;align-items:center;min-height:52px;margin-bottom:-1px;border-bottom:2px solid transparent;font-family:'ABC Oracle',Inter,'Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:500;color:#5A5F61;text-decoration:none;white-space:nowrap;transition:color .15s,border-color .15s}
.navlink:hover{color:#003E32}
.navlink[aria-current="true"]{color:#003E32;border-bottom-color:#003E32}
.navlink:focus-visible{outline:2px solid #006F62;outline-offset:-2px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}

.attr-row:hover{background:#FBF7F3}
.attr-row:focus-visible,select:focus-visible{outline:2px solid #006F62;outline-offset:2px}
a{color:#006F62}a:hover{color:#003E32}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

  renderVals() {

    const w = (x) => (x == null ? '0%' : Math.max(0, Math.min(100, x)).toFixed(1) + '%');
    const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
    const money = (n) => (n >= 1e6 ? '$' + (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? '$' + Math.round(n / 1e3) + 'K' : '$' + r0(n));
    const sqft = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M sq ft' : n >= 1e3 ? Math.round(n / 1e3) + 'K sq ft' : r0(n) + ' sq ft');

    // stakeholder

    const projSel = typeof st.stk === 'string' && st.stk.startsWith('p:') ? +st.stk.slice(2) : null;
    const isProject = projSel != null && !(this.props.audience === 'generic' || st.generic);

    let ptype = st.ptype != null && st.ptype !== 'all' ? +st.ptype : -1;
    const avail = (fn, other) => { const m = new Map(); baseIds.forEach((id) => { const r = D.rows[id]; if ((mePO < 0 || r[10] === mePO) && other(r)) { const k = fn(r); m.set(k, (m.get(k) || new Set()).add(r[0])); } }); return m; };

var navLock = null, navTimer = null;

  clearInterval(galTimer); galTimer = null;
